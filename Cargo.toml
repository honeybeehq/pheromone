[workspace]
resolver = "2"
members = ["crates/pher-core", "crates/pher"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/honeybee/pheromone"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
