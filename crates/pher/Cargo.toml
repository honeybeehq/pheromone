[package]
name = "pher"
description = "Pheromone CLI + pherd-lite daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pher"
path = "src/main.rs"

[dependencies]
pher-core = { path = "../pher-core" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
humantime = "2"
ureq = { version = "2", default-features = false, features = ["tls"] }
pher-embed = { version = "0.1.0", path = "../pher-embed" }
tiny_http = "0.12"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
