# Stripe: the account event stream (the cleanest events API in SaaS).
#   pher connect add stripe --token env:STRIPE_SECRET_KEY
# Token: a restricted key with Events read is enough.
name = "stripe"
description = "Stripe account events (payments, invoices, disputes) as stripe.<type> events"
docs = "https://docs.stripe.com/api/events"

[auth]
header = "Authorization"
format = "Bearer {token}"

[[poll]]
name = "events"
url = "https://api.stripe.com/v1/events?limit=50"
interval = "60s"
records = "data"
subject = "stripe.{type}"
id = "id"
ts = "created"
watermark = "created"
